<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Einkaufszettel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>
    <div id="main">
        <h1>Einkaufszettel</h1>

        <div class="add-section">
            <h2>Artikel hinzufügen</h2>
            <form action="/hinzufuegen" method="post">
                Name: <input type="text" name="name" required>
                Anzahl: <input type="number" name="anzahl" min="1" required>
                <button type="submit">Hinzufügen</button>
            </form>

            <button class="barcode-btn" onclick="startScanner()">Barcode Scannen</button>
        </div>

        <div id="scanner" style="display: none; width: 300px; height: 200px; border: 1px solid #000;"></div>

        <h2>Aktuelle Artikel</h2>
        <ul id="artikel-liste">
            {% for artikel in einkaufszettel %}
            <li>
                {{ artikel.anzahl }}x {{ artikel.name }}
                <form action="/aendern/{{ loop.index0 }}" method="post" style="display:inline">
                    <input type="number" name="anzahl" min="1" required>
                    <button type="submit">Ändern</button>
                </form>
                <a href="/loeschen/{{ loop.index0 }}" id="loeschen-link">Löschen</a>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
