<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einkaufszettel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>

<div id="info">
    <p>Der Barcode-Scan funktioniert leider noch nicht.</p>
    <div id="links">
        <a class="angebot aldi" target="_blank" href="https://www.aldi-nord.de/suchergebnis.html?search=">Aldi</a>
        <a class="angebot rewe" target="_blank" href="https://www.rewe.de/angebote/nationale-angebote/?source=mc_offers">REWE</a>
    </div>
</div>

<div id="main">
    <h1>Einkaufszettel</h1>

    <div class="add-section">
        <h2>Artikel hinzufügen</h2>
        <!-- Optional: Formular für manuelles Hinzufügen -->
        <form action="/hinzufuegen" method="post">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" required>
            <label for="anzahl">Anzahl:</label>
            <input type="number" name="anzahl" id="anzahl" min="1" required>
            <button type="submit">Hinzufügen</button>
        </form>

        <button class="barcode-btn">Barcode Scannen</button>
    </div>

    <div id="scanner" style="display:none; width: 300px; height: 200px; border:1px solid #000;"></div>

    <h2>Aktuelle Artikel</h2>
    <div id="artikel-container">
        {% for artikel in einkaufszettel %}
        <div class="artikel-balken" data-index="{{ loop.index0 }}">
            <div class="anzahl">{{ artikel.anzahl }}</div>
            <div class="name">{{ artikel.name }}</div>
            <div class="aktionen">
                <button class="aendern-btn">Ändern</button>
                <a href="/loeschen/{{ loop.index0 }}" class="loeschen-link">Löschen</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
